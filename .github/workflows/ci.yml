name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 代码门禁：格式 + 静态检查 + 单测
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run check
      - run: npm test

  # E2E 冒烟：Playwright 跑回归用例
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Docker 构建与冒烟：验证多阶段构建与容器内启动链路
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t delivery_van .
      - name: 启动容器并冒烟
        run: |
          docker run -d --name dv -p 3000:3000 delivery_van
          # 首次启动要装原生模块外的建表等初始化，给一点余量
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/trpc/ping > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/ | grep -q 'lang="zh-CN"'
          curl -sf http://localhost:3000/api/trpc/ping | grep -q ok
          docker logs dv
      - name: 数据卷持久化验证（发版验收项：容器重建数据不丢）
        run: |
          docker rm -f dv
          # 第一段：挂数据卷启动，写入一班新车
          docker run -d --name dv-vol -p 3000:3000 -v dv_data:/app/data delivery_van
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/trpc/ping > /dev/null; then break; fi
            sleep 1
          done
          curl -sf -X POST -H 'content-type: application/json' \
            -d '{"json":{}}' \
            http://localhost:3000/api/trpc/van.vans.dispatch | grep -q '"DV'
          # 第二段：销毁容器后用同一数据卷重建，数据应仍在
          docker rm -f dv-vol
          docker run -d --name dv-vol2 -p 3000:3000 -v dv_data:/app/data delivery_van
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/trpc/ping > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/trpc/van.vans.list | grep -q '"DV'
      - name: 清理
        if: always()
        run: |
          docker rm -f dv dv-vol dv-vol2 2>/dev/null || true
          docker volume rm dv_data 2>/dev/null || true
