name: Release

# 打 v* tag 时发布：构建镜像推 GHCR + 打 zip 包创建 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release
  packages: write # 推送 GHCR 镜像

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 打包 zip（源码 + 已构建 dist，解压后 npm ci && npm start 即用）
        run: |
          ZIP="delivery_van-${GITHUB_REF_NAME}.zip"
          zip -r "$ZIP" . -x "node_modules/*" ".git/*" "data/*" "test-results/*" "playwright-report/*"
          ls -lh "$ZIP"
      - name: 构建镜像并冒烟
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/delivery_van"
          docker build -t "$IMAGE:${GITHUB_REF_NAME}" -t "$IMAGE:latest" .
          docker run -d --name rel -p 3000:3000 "$IMAGE:${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/trpc/ping > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/ | grep -q 'lang="zh-CN"'
          curl -sf http://localhost:3000/api/trpc/ping | grep -q ok
          # v2.4 MCP 冒烟：端点必须真的在容器里可握手（曾经栽过 dev 正常/prod 挂的坑，
          # 故冒烟必查）。Streamable HTTP 须同时 accept json 与 event-stream，响应是 SSE 帧。
          curl -sf -X POST http://localhost:3000/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release-smoke","version":"0"}}}' \
            | grep -q '"name":"delivery_van"'
          docker rm -f rel
      - name: 登录 GHCR 并推送镜像
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/delivery_van"
          docker push "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:latest"
      - name: 创建 Release 并附 zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<EOF
          快递发车台 $GITHUB_REF_NAME「STEINS;GATE」（v2.x 主版本线代号；v2.0/v2.1 未独立发版，v2.0 随 v2.2.0 合并首发）。

          v2.5 本版变化：**每人点数制**——点数从"件级档位"改为**归属到人**：一件多人负责时，
          每个负责人各自持有自己的那份点数（各 0~10 点，0 = 挂名不占运力），任务点数是各人之和，
          未指派负责人的件计 0 点。这修掉了旧口径的系统性失真：一件 5 点的活挂 2 人，原口径
          会给两人各记 5 点（真实数据里本班三人被记成各 19/10「超载」，按人记之后各 5.6 点、
          无人超载）。负责人编辑器随之重做：**勾选负责人 ≠ 设置完成**（每人必须填自己的点数，
          没填满不能确定，没填满关闭会明确提示"已放弃修改"，不再静默回滚）；行内直接显示每人
          「本周已装（不含这件）/ 上限」并即时预览加上这件之后会不会压超载；支持键盘输入与
          回车跳下一个人。件级 `size` 列废弃，存量数据在启动时按旧档位均分一次性回填
          （幂等、历史可追溯）。另：负责人聚合不再走 `group_concat`，顺带消除 MySQL 上的
          静默截断隐患。下一版（v2.6）计划把完成与签收也拆到人，已立项。

          周度发车管理工具：DV 班次编码（每月从 A 重计）、每人点数制（每人 0~10 点，1 点 = 半天，
          任务点数 = 各负责人点数之和）、行拖拽排序、送达二值化 + 日期补录、滞留结转（紧邻班次
          校验 + 归档只读 + ≥2 班强制复盘提示）、五级稀有度（N/R/SR/SSR/UR）与提出人标记、
          统计条与成员运力（整车装载 / 团队周运力）。

          ## Docker（sqlite 务必挂数据卷；pg/mysql 传连接串无需挂卷）

              docker pull ghcr.io/${{ github.repository_owner }}/delivery_van:$GITHUB_REF_NAME
              docker run -p 3000:3000 -v delivery_van_data:/app/data ghcr.io/${{ github.repository_owner }}/delivery_van:$GITHUB_REF_NAME
              # postgres：docker run -p 3000:3000 -e DB_DIALECT=postgres -e DATABASE_URL=postgres://user:pass@host:5432/delivery_van ...

          ## zip 包（无 Docker，需 Node >= 22）

          下载下方 delivery_van-$GITHUB_REF_NAME.zip（内含已构建的 dist/），解压后：

              npm ci
              npm start

          库文件默认 ./data/delivery_van.db，可用 DATABASE_URL 覆盖；端口默认 3000 可用 PORT 覆盖。
          详细规则见仓库 README 与《周度发车机制设计方案》《博弈机制科研探索》。

          质量：单测 220（+ CI 容器 pg/mysql 方言变体 80 例）/ E2E 23 / CI 三 job 全绿；容器自动建表
          与数据卷持久化由 CI 的 docker job 验证，容器冒烟另含 MCP 端点握手。
          EOF
          )
          gh release create "$GITHUB_REF_NAME" "delivery_van-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME「STEINS;GATE」" --notes "$NOTES"
